:root {
  --primary: #2c3e50;
  --accent: #3498db;
  --accent-hover: #2980b9;
  --accent-light: #e3f2fd;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;

}

html { scroll-behavior: smooth; }
body {

.top-nav {

  padding: 0 30px; transition: var(--transition);
}
.top-nav.scrolled { box-shadow: var(--shadow); }
.nav-brand {

  font-size: 1.2rem; font-weight: 700; color: var(--primary); text-decoration: none;
}

.nav-links { display: flex; gap: 30px; list-style: none; }
.nav-links a {
  text-decoration: none; color: var(--text-light); font-size: 0.95rem; font-weight: 500;
  position: relative; transition: var(--transition);
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -4px; left: 0;
  width: 0; height: 2px; background: var(--accent); transition: var(--transition);
}
.nav-links a:hover,.nav-links a.active { color: var(--accent); }
.nav-links a:hover::after,.nav-links a.active::after { width: 100%; }

.menu-toggle {
  display: none; position: fixed; top: 16px; right: 20px; z-index: 1000;
  cursor: pointer; width: 32px; height: 32px; flex-direction: column;
  justify-content: center; align-items: center; gap: 5px;

}
.menu-toggle span { display: block; width: 20px; height: 2.5px; background: var(--primary); border-radius: 2px; transition: 0.3s; }
.menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.menu-toggle.active span:nth-child(2) { opacity: 0; }
.menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

.menu {
  position: fixed; top: 0; right: -320px; width: 320px; height: 100vh;

}
.menu.active { right: 0; }
.menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); opacity: 0; visibility: hidden; transition: 0.3s; z-index: 998; }

.content-container { max-width: 1200px; margin: 0 auto; padding: 90px 20px 40px; }

  <script>
function renderAnnouncementItem(item) {
  const pinnedClass = item.pinned ? ' pinned' : '';
  const badgeHtml = item.pinned ? '<div class="announcement-badge">📌 置顶</div>' : '';
  const btnHtml = (item.url && item.btnText) ? `<a href="${item.url}" target="_blank" rel="noopener" class="btn btn-primary" style="margin-top:15px;"><span>🔗</span> ${item.btnText}</a>` : '';
  return `<div class="announcement-item${pinnedClass}">
    ${badgeHtml}
    <div class="announcement-content">
      <h3>${item.title}</h3>
      <div class="announcement-meta"><span>📅 ${item.date}</span><span>🏷️ ${item.tag}</span></div>
      <p>${item.content}</p>
      ${btnHtml}
    </div>
  </div>`;
}

function setupAnimations() {
  const obsLocal = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        e.target.classList.add('animate-in');
        obsLocal.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
  document.querySelectorAll('.announcement-item').forEach(function(el) {
    el.style.opacity = '0';
    obsLocal.observe(el);
  });
}

function renderAnnouncements() {
  if (typeof announcementData === 'undefined') return;
  const list = document.getElementById('announcementList');
  if (!list) return;
  if (announcementData.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:30px 0;">⏳ 暂无公告，敬请期待...</p>';
    return;
  }
  list.innerHTML = announcementData.map(item => renderAnnouncementItem(item)).join('');
  setupAnimations();
}

function ensureAnnouncementData(cb) {
  if (typeof announcementData !== 'undefined') { cb(); return; }
  var s = document.createElement('script');
  s.src = 'announcement-data.js';
  s.onload = function() { cb(); };
  s.onerror = function() { console.error('无法加载 announcement-data.js'); cb(); };
  document.head.appendChild(s);
}

document.addEventListener('DOMContentLoaded', function() { ensureAnnouncementData(renderAnnouncements); });
  </script>
